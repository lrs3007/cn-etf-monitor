services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:${POSTGRES_PASSWORD}@db:5432/monitor
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:${POSTGRES_PASSWORD}@db:5432/monitor
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "backend.app.scheduler"]
    restart: unless-stopped
volumes:
  pgdata:
